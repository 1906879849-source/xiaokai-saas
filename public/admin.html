<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAI 管理员后台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0c0f;color:#eef0f4;font:14px "Microsoft YaHei UI","Segoe UI",sans-serif}button,input{font:inherit}.wrap{max-width:1180px;margin:auto;padding:28px}.head{display:flex;align-items:center;gap:12px;margin-bottom:22px}.head h1{margin:0;font-size:24px}.head a{margin-left:auto;color:#8ebcff}.card{padding:18px;border:1px solid #30343a;border-radius:15px;background:#181a1f;margin-bottom:18px}.login{max-width:420px;margin:12vh auto}.form{display:grid;gap:10px}.form input{height:42px;padding:0 11px;border:1px solid #383c44;border-radius:9px;background:#101216;color:white}.primary{height:40px;border:0;border-radius:9px;background:#eef0f4;color:#15161a;font-weight:700;cursor:pointer}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{padding:9px 14px;border:1px solid #343840;border-radius:9px;background:#202329;color:#cfd3da;cursor:pointer}.tabs button.on{background:#e9ebee;color:#18191c}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:1.2fr .8fr .8fr 1fr auto;gap:14px;align-items:center;padding:12px;border:1px solid #30343a;border-radius:11px;background:#202226}.row small{color:#8d939d}.actions{display:flex;gap:7px}.actions button{height:34px;padding:0 11px;border:0;border-radius:8px;cursor:pointer}.approve{background:#2f8d62;color:white}.reject{background:#91434b;color:white}.receipt{max-width:120px;max-height:80px;border-radius:7px;cursor:pointer}.status-pending{color:#ffc560}.status-approved{color:#69d99c}.status-rejected{color:#ff8f99}.empty{padding:30px;text-align:center;color:#777d87}@media(max-width:800px){.row{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body><main class="wrap"><section class="card login" id="login"><h1>管理员登录</h1><p style="color:#949aa5">使用画布中注册的管理员账号登录。</p><form class="form" id="loginForm"><input id="username" placeholder="管理员账号" required><input id="password" type="password" placeholder="密码" required><button class="primary">登录</button></form></section><section id="app" hidden><div class="head"><h1>KAI 管理员后台</h1><span id="adminName"></span><a href="/">返回画布</a></div><div class="tabs"><button class="on" data-tab="recharges">充值审核</button><button data-tab="users">用户管理</button></div><section class="card"><div class="list" id="content"></div></section></section></main>
<script>
const $=s=>document.querySelector(s);let me=null,tab='recharges';
async function api(path,options={}){const response=await fetch(path,{credentials:'include',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const data=await response.json();if(!response.ok||data.ok===false)throw new Error(data.error||'请求失败');return data}
async function boot(){try{const data=await api('/api/auth/me');if(data.user.role!=='admin')throw new Error('当前账号不是管理员');me=data.user;$('#login').hidden=true;$('#app').hidden=false;$('#adminName').textContent=me.displayName||me.username;render()}catch(error){$('#login').hidden=false;$('#app').hidden=true}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value})});boot()}catch(error){alert(error.message)}};
document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{tab=button.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===button));render()});
async function render(){const root=$('#content');root.innerHTML='<div class="empty">正在读取…</div>';try{if(tab==='recharges')await renderRecharges(root);else await renderUsers(root)}catch(error){root.innerHTML='<div class="empty">'+error.message+'</div>'}}
async function renderRecharges(root){const data=await api('/api/admin/recharges?limit=100');root.replaceChildren();const labels={pending:'待审核',approved:'已到账',rejected:'已拒绝'};for(const item of data.recharges){const row=document.createElement('div');row.className='row';row.innerHTML=`<div><b>${item.username}</b><br><small>${item.id}<br>${new Date(item.createdAt).toLocaleString()}</small></div><div>${item.channel==='wechat'?'微信':'支付宝'}<br><b>¥${Number(item.amountRmb).toFixed(2)}</b></div><div>${item.points} 积分<br><small>请核对实际到账时间与金额</small></div><div>${item.hasReceipt?`<img class="receipt" src="/api/admin/recharges/${item.id}/receipt" alt="付款截图">`:'<small>无截图</small>'}</div><div><b class="status-${item.status}">${labels[item.status]||item.status}</b><div class="actions" ${item.status==='pending'?'':'hidden'}><button class="approve">通过</button><button class="reject">拒绝</button></div></div>`;row.querySelector('.receipt')?.addEventListener('click',()=>window.open(row.querySelector('.receipt').src,'_blank'));row.querySelector('.approve')?.addEventListener('click',()=>review(item.id,'approved'));row.querySelector('.reject')?.addEventListener('click',()=>review(item.id,'rejected'));root.appendChild(row)}if(!data.recharges.length)root.innerHTML='<div class="empty">暂无充值申请</div>'}
async function review(id,status){const note=prompt(status==='approved'?'审核备注（可留空）':'拒绝原因','')??'';try{await api('/api/admin/recharges/'+encodeURIComponent(id)+'/review',{method:'POST',body:JSON.stringify({status,reviewNote:note})});render()}catch(error){alert(error.message)}}
async function renderUsers(root){const data=await api('/api/admin/users');root.replaceChildren();for(const user of data.users){const row=document.createElement('div');row.className='row';row.innerHTML=`<div><b>${user.displayName||user.username}</b><br><small>${user.username}</small></div><div>${user.role}</div><div>${user.status}</div><div><small>${new Date(user.createdAt).toLocaleString()}</small></div><div class="actions"><button class="approve">增加积分</button></div>`;row.querySelector('button').onclick=async()=>{const points=Number(prompt('增加多少积分？','100'));if(!Number.isInteger(points)||points<1)return;try{await api('/api/admin/users/'+user.id+'/grant',{method:'POST',body:JSON.stringify({points})});alert('已增加 '+points+' 积分')}catch(error){alert(error.message)}};root.appendChild(row)}if(!data.users.length)root.innerHTML='<div class="empty">暂无用户</div>'}
boot();
</script></body></html>
