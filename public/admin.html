<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KAI 管理员后台</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b0c0f;color:#eef0f4;font:14px "Microsoft YaHei UI","Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.wrap{max-width:1180px;margin:auto;padding:28px}.head{display:flex;align-items:center;gap:12px;margin-bottom:22px}.head h1{margin:0;font-size:24px}.head a{margin-left:auto;color:#8ebcff}.card{padding:18px;border:1px solid #30343a;border-radius:15px;background:#181a1f;margin-bottom:18px}.login{max-width:420px;margin:12vh auto}.form{display:grid;gap:10px}.form input,.form textarea,.form select{width:100%;padding:10px 11px;border:1px solid #383c44;border-radius:9px;background:#101216;color:white}.form textarea{min-height:110px;resize:vertical}.primary{height:40px;padding:0 14px;border:0;border-radius:9px;background:#eef0f4;color:#15161a;font-weight:700;cursor:pointer}.primary:disabled,.actions button:disabled{opacity:.5;cursor:wait}.alert-button{height:36px;padding:0 12px;border:1px solid #3b414b;border-radius:9px;background:#202329;color:#d7dae0;cursor:pointer}.alert-button.on{border-color:#2f8d62;color:#77dda9;background:#173327}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs button{position:relative;padding:9px 14px;border:1px solid #343840;border-radius:9px;background:#202329;color:#cfd3da;cursor:pointer}.tabs button.on{background:#e9ebee;color:#18191c}.badge{display:none;position:absolute;right:-7px;top:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#ef4e57;color:#fff;font-size:11px;line-height:19px}.badge.show{display:block}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:1.2fr .8fr .8fr 1fr auto;gap:14px;align-items:center;padding:12px;border:1px solid #30343a;border-radius:11px;background:#202226}.row small,.muted{color:#8d939d}.actions{display:flex;gap:7px}.actions button{height:34px;padding:0 11px;border:0;border-radius:8px;cursor:pointer}.approve{background:#2f8d62;color:white}.reject{background:#91434b;color:white}.receipt{max-width:120px;max-height:80px;border-radius:7px;cursor:pointer}.status-pending{color:#ffc560}.status-approved{color:#69d99c}.status-rejected{color:#ff8f99}.empty{padding:30px;text-align:center;color:#777d87}.announcement-form{display:grid;grid-template-columns:1fr 150px auto;gap:10px;margin-bottom:16px}.announcement-form textarea{grid-column:1/3}.announcement-form button{grid-column:3;grid-row:1/3;height:auto}.announcement-row{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid #30343a;border-radius:11px;background:#202226}.announcement-row .body{flex:1;white-space:pre-wrap;line-height:1.65}.announcement-row h3{margin:0 0 7px;font-size:15px}.level{display:inline-block;padding:2px 7px;border-radius:10px;background:#30343a;font-size:11px;color:#cdd2da;margin-left:7px}@media(max-width:800px){.row{grid-template-columns:1fr}.wrap{padding:14px}.head{flex-wrap:wrap}.head a{margin-left:0}.announcement-form{grid-template-columns:1fr}.announcement-form textarea,.announcement-form button{grid-column:auto;grid-row:auto}.announcement-form button{height:42px}}
  </style>
</head>
<body>
<main class="wrap">
  <section class="card login" id="login">
    <h1>管理员登录</h1><p class="muted">使用画布中注册的管理员账号登录。</p>
    <form class="form" id="loginForm"><input id="username" placeholder="管理员账号" required><input id="password" type="password" placeholder="密码" required><button class="primary">登录</button></form>
  </section>
  <section id="app" hidden>
    <div class="head"><h1>KAI 管理员后台</h1><span id="adminName"></span><button class="alert-button" id="alertButton">开启充值提醒</button><a href="/">返回画布</a></div>
    <div class="tabs">
      <button class="on" data-tab="recharges">充值审核<span class="badge" id="rechargeBadge"></span></button>
      <button data-tab="users">用户管理</button>
      <button data-tab="announcements">公告栏</button>
    </div>
    <section class="card"><div class="list" id="content"></div></section>
  </section>
</main>
<script>
const $=selector=>document.querySelector(selector);
let me=null,tab='recharges',knownPending=null,pendingCount=0;
let alertsEnabled=localStorage.getItem('kai-admin-recharge-alerts')==='1';
async function api(path,options={}){const response=await fetch(path,{credentials:'include',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let data={};try{data=await response.json()}catch{}if(!response.ok||data.ok===false)throw new Error(data.error||'请求失败');return data}
function updateAlertButton(){const button=$('#alertButton');button.classList.toggle('on',alertsEnabled);button.textContent=alertsEnabled?'充值提醒已开启':'开启充值提醒'}
async function enableAlerts(){alertsEnabled=!alertsEnabled;if(alertsEnabled&&'Notification'in window&&Notification.permission==='default'){const result=await Notification.requestPermission();if(result==='denied')alertsEnabled=false}localStorage.setItem('kai-admin-recharge-alerts',alertsEnabled?'1':'0');updateAlertButton();if(alertsEnabled)beep()}
function beep(){try{const Context=window.AudioContext||window.webkitAudioContext;const context=new Context(),osc=context.createOscillator(),gain=context.createGain();osc.frequency.value=880;gain.gain.setValueAtTime(.08,context.currentTime);gain.gain.exponentialRampToValueAtTime(.001,context.currentTime+.35);osc.connect(gain).connect(context.destination);osc.start();osc.stop(context.currentTime+.35)}catch{}}
function notifyRecharge(item){if(!alertsEnabled)return;beep();if('Notification'in window&&Notification.permission==='granted')new Notification('收到新的充值申请',{body:`${item.username} · ¥${Number(item.amountRmb).toFixed(2)} · ${item.points} 积分`,tag:'recharge-'+item.id});}
function setPendingCount(count){pendingCount=count;const badge=$('#rechargeBadge');badge.textContent=count>99?'99+':String(count);badge.classList.toggle('show',count>0);document.title=(count?`(${count}) `:'')+'KAI 管理员后台'}
async function pollRecharges(renderCurrent=false){if(!me)return;try{const data=await api('/api/admin/recharges?limit=100');const pending=data.recharges.filter(item=>item.status==='pending');const ids=new Set(pending.map(item=>item.id));if(knownPending){pending.filter(item=>!knownPending.has(item.id)).forEach(notifyRecharge)}knownPending=ids;setPendingCount(pending.length);if(renderCurrent&&tab==='recharges')renderRecharges($('#content'),data)}catch(error){console.warn('充值轮询失败',error)}}
async function boot(){try{const data=await api('/api/auth/me');if(data.user.role!=='admin')throw new Error('当前账号不是管理员');me=data.user;$('#login').hidden=true;$('#app').hidden=false;$('#adminName').textContent=me.displayName||me.username;updateAlertButton();await pollRecharges(false);render()}catch{$('#login').hidden=false;$('#app').hidden=true}}
$('#alertButton').onclick=enableAlerts;
$('#loginForm').onsubmit=async event=>{event.preventDefault();try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value})});boot()}catch(error){alert(error.message)}};
document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{tab=button.dataset.tab;document.querySelectorAll('[data-tab]').forEach(item=>item.classList.toggle('on',item===button));render()});
async function render(){const root=$('#content');root.innerHTML='<div class="empty">正在读取…</div>';try{if(tab==='recharges'){const data=await api('/api/admin/recharges?limit=100');renderRecharges(root,data)}else if(tab==='users')await renderUsers(root);else await renderAnnouncements(root)}catch(error){root.replaceChildren();const empty=document.createElement('div');empty.className='empty';empty.textContent=error.message;root.appendChild(empty)}}
function renderRecharges(root,data){root.replaceChildren();const labels={pending:'待审核',approved:'已到账',rejected:'已拒绝'};for(const item of data.recharges){const row=document.createElement('div');row.className='row';const identity=document.createElement('div');const name=document.createElement('b');name.textContent=item.username;const detail=document.createElement('small');detail.textContent=`${item.id}\n${new Date(item.createdAt).toLocaleString()}`;detail.style.whiteSpace='pre-line';identity.append(name,document.createElement('br'),detail);const payment=document.createElement('div');payment.innerHTML=`${item.channel==='wechat'?'微信':'支付宝'}<br><b>¥${Number(item.amountRmb).toFixed(2)}</b>`;const points=document.createElement('div');points.textContent=item.points+' 积分';const hint=document.createElement('small');hint.textContent='请核对实际到账时间与金额';points.append(document.createElement('br'),hint);const receiptBox=document.createElement('div');if(item.hasReceipt){const image=document.createElement('img');image.className='receipt';image.src='/api/admin/recharges/'+encodeURIComponent(item.id)+'/receipt';image.alt='付款截图';image.onclick=()=>window.open(image.src,'_blank');receiptBox.appendChild(image)}else{const no=document.createElement('small');no.textContent='无截图';receiptBox.appendChild(no)}const state=document.createElement('div');const status=document.createElement('b');status.className='status-'+item.status;status.textContent=labels[item.status]||item.status;state.appendChild(status);if(item.status==='pending'){const actions=document.createElement('div');actions.className='actions';const approve=document.createElement('button');approve.className='approve';approve.textContent='通过';approve.onclick=()=>review(item.id,'approved',approve,actions);const reject=document.createElement('button');reject.className='reject';reject.textContent='拒绝';reject.onclick=()=>review(item.id,'rejected',reject,actions);actions.append(approve,reject);state.appendChild(actions)}row.append(identity,payment,points,receiptBox,state);root.appendChild(row)}if(!data.recharges.length)root.innerHTML='<div class="empty">暂无充值申请</div>'}
async function review(id,status,button,actions){const note=prompt(status==='approved'?'审核备注（可留空）':'拒绝原因','');if(note===null)return;[...actions.querySelectorAll('button')].forEach(item=>item.disabled=true);button.textContent='处理中…';try{await api('/api/admin/recharges/'+encodeURIComponent(id)+'/review',{method:'POST',body:JSON.stringify({status,reviewNote:note})});await pollRecharges(true)}catch(error){alert(error.message);render()} }
async function renderUsers(root){const data=await api('/api/admin/users');root.replaceChildren();for(const user of data.users){const row=document.createElement('div');row.className='row';const identity=document.createElement('div');const name=document.createElement('b');name.textContent=user.displayName||user.username;const username=document.createElement('small');username.textContent=user.username;identity.append(name,document.createElement('br'),username);const role=document.createElement('div');role.textContent=user.role;const state=document.createElement('div');state.textContent=user.status;const date=document.createElement('div');const small=document.createElement('small');small.textContent=new Date(user.createdAt).toLocaleString();date.appendChild(small);const actions=document.createElement('div');actions.className='actions';const grant=document.createElement('button');grant.className='approve';grant.textContent='增加积分';grant.onclick=async()=>{const points=Number(prompt('增加多少积分？','100'));if(!Number.isInteger(points)||points<1)return;grant.disabled=true;try{await api('/api/admin/users/'+encodeURIComponent(user.id)+'/grant',{method:'POST',body:JSON.stringify({points})});alert('已增加 '+points+' 积分')}catch(error){alert(error.message)}finally{grant.disabled=false}};actions.appendChild(grant);row.append(identity,role,state,date,actions);root.appendChild(row)}if(!data.users.length)root.innerHTML='<div class="empty">暂无用户</div>'}
async function renderAnnouncements(root){const data=await api('/api/admin/announcements');root.replaceChildren();const form=document.createElement('form');form.className='form announcement-form';form.innerHTML='<input name="title" maxlength="60" placeholder="公告标题" required><select name="level"><option value="info">普通公告</option><option value="success">成功/活动</option><option value="warning">重要提醒</option></select><textarea name="content" maxlength="1000" placeholder="公告内容" required></textarea><button class="primary">发布公告</button>';form.onsubmit=async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;button.textContent='发布中…';try{await api('/api/admin/announcements',{method:'POST',body:JSON.stringify({title:form.title.value,content:form.content.value,level:form.level.value})});renderAnnouncements(root)}catch(error){alert(error.message);button.disabled=false;button.textContent='发布公告'}};root.appendChild(form);for(const item of data.announcements){const row=document.createElement('div');row.className='announcement-row';const body=document.createElement('div');body.className='body';const heading=document.createElement('h3');heading.textContent=item.title;const level=document.createElement('span');level.className='level';level.textContent={info:'普通',success:'活动',warning:'重要'}[item.level]||item.level;heading.appendChild(level);const content=document.createElement('div');content.textContent=item.content;const meta=document.createElement('small');meta.textContent=new Date(item.createdAt).toLocaleString();body.append(heading,content,meta);const remove=document.createElement('button');remove.className='reject';remove.textContent='删除';remove.onclick=async()=>{if(!confirm('删除这条公告？'))return;remove.disabled=true;try{await api('/api/admin/announcements/'+encodeURIComponent(item.id),{method:'DELETE'});renderAnnouncements(root)}catch(error){alert(error.message);remove.disabled=false}};row.append(body,remove);root.appendChild(row)}if(!data.announcements.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='暂无公告';root.appendChild(empty)}}
setInterval(()=>pollRecharges(tab==='recharges'),12000);
boot();
</script>
</body>
</html>
