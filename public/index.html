    if(!isRealModel(next.model)){
      next.status='error';next.phase='failed';next.note='当前模型没有可用的图片接口';next.errorReason=next.note;next.finishedAt=Date.now();
      showGenerationFailure(node,next,next.errorReason,'uploading');
      setNodeStatus(node,'error','模型未接入');renderTaskQueue();scheduleSave();setTimeout(processWorkflowQueue,50);return;
    }
    enrichTask(next,node);
    activeGenerationTasks.add(next.id);
    sharedConcurrency.active.add(next.id);
    next.status='running';next.phase='uploading';next.startedAt=next.startedAt||Date.now();
    runRealGeneration(next,node).finally(()=>{
      activeGenerationTasks.delete(next.id);sharedConcurrency.active.delete(next.id);renderTaskQueue();scheduleSave();setTimeout(processWorkflowQueue,100)
    });
    setTimeout(processWorkflowQueue,0);
  };
  // Recover automatically if an older build, refresh, or aborted request left only a
  // stale runtime lock while visible tasks are still waiting.
  if(!window.__kaiQueueWatchdog){
    window.__kaiQueueWatchdog=setInterval(()=>{
      const active=workflowQueue.find(task=>task.id===workflowActiveTask&&task.status==='running');
      if(workflowActiveTask&&!active)workflowActiveTask=null;
      if(workflowQueue.some(task=>task.status==='pending')&&!workflowActiveTask)processWorkflowQueue();
    },1000);
  }

  // 启动时检查后端是否在线；不会读取或暴露 Kie Key。
  requestAnimationFrame(()=>{
    apiFetch('/api/health',{timeoutMs:3500}).then(data=>{
      if(!data.rivoConfigured)note('后端已连接，但还没有在 Railway Variables 配置 RIVO_API_KEY');
    }).catch(()=>{});
  });
  // Expose the two task helpers while they are still inside their defining scope.
  window.KAI_IMAGE_RUNTIME={pollProviderTasks,applyRealResults,confirmTemporaryDeliveries,showGenerationFailure,clearGenerationFailure};
})();


/* MODEL_SELECTION_SYNC_FIX_V1_1 */
(function(){
  let restoringNodeModel=false;
  const supportedRealModels=new Set(['Nano Banana 2','Nano Banana Pro','GPT Image 2','GPT Image 2.5 Flare','GPT Image 2.5 Sunburst']);
  const _applyModelChoiceSync=applyModelChoice;
  applyModelChoice=function(model){
    _applyModelChoiceSync(model);
    if(restoringNodeModel)return;
    if(selectedNode?.classList.contains('generation-node')){
      selectedNode.dataset.modelName=model;
      selectedNode.dataset.lastSelectedModelName=model;
      scheduleSave();
    }
  };

  const _loadPromptFromNodeSync=loadPromptFromNode;
  loadPromptFromNode=function(node){
    _loadPromptFromNodeSync(node);
    if(!node?.classList.contains('generation-node'))return;
    const model=(node.dataset.modelName||'').trim();
    if(!model)return;
    const exists=[...document.querySelectorAll('.model-choice')].some(btn=>btn.dataset.model===model);
    if(!exists)return;
    restoringNodeModel=true;
    try{_applyModelChoiceSync(model)}finally{restoringNodeModel=false}
  };

  const _createGenerationNodeSync=createGenerationNode;
  createGenerationNode=function(...args){
    const node=_createGenerationNodeSync(...args);
    if(node?.classList.contains('generation-node')){
      const modelLabel=document.getElementById('modelLabel');const visibleModel=modelLabel?.dataset?.model||modelLabel?.textContent?.trim()||'GPT Image 2';
      node.dataset.modelName=visibleModel;
      node.dataset.lastSelectedModelName=visibleModel;
      scheduleSave();
    }
    return node;
  };

  function refreshRealModelAvailability(){
    document.querySelectorAll('.model-choice').forEach(btn=>{
      const supported=supportedRealModels.has(btn.dataset.model);
      btn.classList.toggle('api-not-connected',!supported);
      btn.title=supported?(btn.dataset.model==='test-image'?'本地 Mock 已接入':'Rivo 图片接口已接入'):'当前图片后端尚未接入此模型';
      btn.setAttribute('aria-disabled',supported?'false':'true');
    });
  }

  // Guard unsupported choices while the Kie V1 backend is active. Keep them visible for future adapters.
  document.addEventListener('click',e=>{
    const btn=e.target.closest('.model-choice');
    if(!btn||supportedRealModels.has(btn.dataset.model))return;
    e.preventDefault();e.stopImmediatePropagation();
    note('当前图片接口暂未接入 '+btn.dataset.model);
  },true);

  const style=document.createElement('style');
  style.textContent='.model-choice.api-not-connected{opacity:.42}.model-choice.api-not-connected::after{content:"未接入";margin-left:auto;color:#777d87;font-size:10px}.model-choice.api-not-connected:hover{background:transparent;cursor:not-allowed}';
  document.head.appendChild(style);
  requestAnimationFrame(refreshRealModelAvailability);
})();



/* MODEL_SOURCE_OF_TRUTH_FIX_V1_2 */
(function(){
  const REAL_SUPPORTED_MODELS_V12=new Set(['Nano Banana 2','Nano Banana Pro','GPT Image 2','GPT Image 2.5 Flare','GPT Image 2.5 Sunburst']);
  const modelLabelElV12=document.getElementById('modelLabel');

  function visibleModelV12(){
    return modelLabelElV12?.dataset?.model||(modelLabelElV12?.textContent||'').trim();
  }
  function usableVisibleModelV12(){
    const visible=visibleModelV12();
    return REAL_SUPPORTED_MODELS_V12.has(visible)?visible:'';
  }
  function fallbackSupportedModelV12(node){
    const nodeModel=(node?.dataset?.modelName||'').trim();
    if(REAL_SUPPORTED_MODELS_V12.has(nodeModel))return nodeModel;
    const visible=usableVisibleModelV12();
    if(visible)return visible;
    return 'GPT Image 2';
  }
  function commitVisibleModelToNodeV12(node,model){
    if(!node?.classList?.contains('generation-node'))return;
    if(!REAL_SUPPORTED_MODELS_V12.has(model))return;
    node.dataset.modelName=model;
    node.dataset.lastSelectedModelName=model;
    scheduleSave();
  }

  // Capture supported model clicks before the legacy click handlers run. This makes the
  // visible selector the source of truth for a normal new run, even on older saved nodes.
  document.addEventListener('click',e=>{
    const btn=e.target.closest('.model-choice');
    if(!btn||!REAL_SUPPORTED_MODELS_V12.has(btn.dataset.model))return;
    if(selectedNode?.classList.contains('generation-node')){
      commitVisibleModelToNodeV12(selectedNode,btn.dataset.model);
    }
  },true);

  // If an older node stored a model that is no longer connected, do not silently restore it
  // over the user's current supported choice.
  const _loadPromptFromNodeV12=loadPromptFromNode;
  loadPromptFromNode=function(node){
    _loadPromptFromNodeV12(node);
    if(!node?.classList.contains('generation-node'))return;
    let model=(node.dataset.modelName||'').trim();
    if(!REAL_SUPPORTED_MODELS_V12.has(model)){
      model=usableVisibleModelV12()||'GPT Image 2';
      commitVisibleModelToNodeV12(node,model);
      if(visibleModelV12()!==model){
        try{applyModelChoice(model)}catch{}
      }
    }
  };

  // Final queue guard. Normal runs ALWAYS use the model currently visible in the panel.
  // Locked reruns still keep the old model when it is supported. Old unsupported snapshots
  // are migrated to the current supported model instead of re-queuing Nano Banana Pro etc.
  const _queueNodeExecutionV12=queueNodeExecution;
  queueNodeExecution=function(node,options={}){
    if(node?.classList.contains('generation-node')){
      const next={...(options||{})};
      // A normal click must snapshot the controls that are visible right now. Older
      // saved nodes may contain a stale dataset.sizeState, which previously caused
      // the panel to show 9:16 while the request was still sent as an older ratio.
      const hasLockedSize=next.lockedSizeState!=null&&String(next.lockedSizeState).trim();
      if(!hasLockedSize){
        try{
          const visibleSizeState=JSON.stringify(captureSizeState());
          next.lockedSizeState=visibleSizeState;
          node.dataset.sizeState=visibleSizeState;
          const visibleRatio=currentRatioText();
          node.dataset.aspectRatioLabel=visibleRatio;
          applyRatioToNodeNow(node,visibleRatio,{save:false});
        }catch{}
      }
      const hasLocked=typeof next.lockedModel==='string'&&next.lockedModel.trim();
      if(!hasLocked){
        const visible=usableVisibleModelV12()||fallbackSupportedModelV12(node);
        commitVisibleModelToNodeV12(node,visible);
        next.lockedModel=visible;
      }else if(!REAL_SUPPORTED_MODELS_V12.has(next.lockedModel.trim())){
        const oldModel=next.lockedModel.trim();
        const replacement=usableVisibleModelV12()||fallbackSupportedModelV12(node);
        next.lockedModel=replacement;
        commitVisibleModelToNodeV12(node,replacement);
        note('旧任务模型 '+oldModel+' 尚未接入，已改用 '+replacement);
      }
      return _queueNodeExecutionV12(node,next);
    }
    return _queueNodeExecutionV12(node,options);
  };

  // Rebind the primary run button after all legacy wrappers, so a normal click cannot pick up
  // stale lastRunModelName / dataset.modelName values from older project saves.
  if(run){
    run.onclick=()=>{
      if(!selectedNode)return note(!promptBox.value.trim()?'请输入修改要求':'请先选择一个生图或 Agent 节点');
      if(selectedNode.classList.contains('generation-node')){
        const model=usableVisibleModelV12();
        if(!model)return note('当前模型尚未接入图片接口');
        commitVisibleModelToNodeV12(selectedNode,model);
        queueNodeExecution(selectedNode,{lockedModel:model});
        return;
      }
      queueNodeExecution(selectedNode);
    };
  }

  // Normalize already-open generation nodes loaded from an older version.
  requestAnimationFrame(()=>{
    nodes.filter(n=>n?.isConnected&&n.classList.contains('generation-node')).forEach(node=>{
      const stored=(node.dataset.modelName||'').trim();
      if(!REAL_SUPPORTED_MODELS_V12.has(stored)){
        commitVisibleModelToNodeV12(node,usableVisibleModelV12()||'GPT Image 2');
      }
    });
  });
})();


/* KIE_TASK_RECOVERY_V1_4 */
(function(){
  const recoveringNodes=new WeakSet();
  const recoveringAgentNodes=new WeakSet();
  let manualRecoveryBusy=false;

  async function apiFetch(path,{method='GET',body,headers={},timeoutMs=45000}={}){
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);
    try{
      const response=await fetch(path,{method,credentials:'same-origin',signal:controller.signal,headers:{...(body?{'Content-Type':'application/json'}:{}),...headers},body:body&&typeof body!=='string'?JSON.stringify(body):body});
      const data=await response.json().catch(()=>({}));
      if(!response.ok||data.ok===false)throw new Error(data.error||('HTTP '+response.status));
      return data;
    }finally{clearTimeout(timer)}
  }

  function savedProviderTasks(node){
    try{
      const value=JSON.parse(node?.dataset?.providerTasks||'[]');
      return Array.isArray(value)?value.filter(x=>x?.taskId):[];
    }catch{return[]}
  }

  function nodeImageState(node){
    const img=node?.querySelector('.uploaded-image');
    if(!img)return'missing';
    if(!img.complete)return'loading';
    return img.naturalWidth>0?'ready':'broken';
  }

  function markBrokenImageForRecovery(node){
    if(!node?.isConnected||!savedProviderTasks(node).length)return;
    node.dataset.providerRecoveryState='pending';
    setNodeStatus(node,'running','重新加载');
    setTimeout(syncCurrentCanvas,80);
  }

  function watchRecoveredImage(node,img){
    if(!img)return;
    img.addEventListener('error',()=>markBrokenImageForRecovery(node),{once:true});
  }

  function forceRecoveredImage(node,url,promptText=''){
    const card=node?.querySelector('.card');
    if(!card||!url)throw new Error('恢复结果缺少图片地址');
    const img=document.createElement('img');
    img.className='uploaded-image';img.alt='恢复的生成结果';img.src=url;
    watchRecoveredImage(node,img);
    const overlay=document.createElement('div');overlay.className='node-run-summary';overlay.textContent='已从图片服务恢复';
    card.replaceChildren(img,overlay);
    node.dataset.outputUrls=JSON.stringify([url]);
    node.dataset.outputText=promptText||node.dataset.promptText||'';
    img.onload=()=>{try{bindNodeControls(node);syncNodeChrome(node);updateCompareNodes();wires();scheduleSave()}catch(error){console.warn('恢复图片后的界面绑定失败',error)}};
  }

  async function recoverNode(node,providerTasks,{legacy=false,quiet=false,force=false}={}){
    const imageState=nodeImageState(node);
    if(!node?.isConnected||['ready','loading'].includes(imageState)||recoveringNodes.has(node)||!providerTasks.length)return false;
    if(!force&&node.__kaiRecoveryFailedAt&&Date.now()-node.__kaiRecoveryFailedAt<30000)return false;
    recoveringNodes.add(node);
    const controller=new AbortController();
    const task={
      id:'recovery-'+Date.now(),nodeId:node.id,name:strippedNodeName(node),type:'generation',status:'running',phase:'generating',
      note:'正在找回生成结果',createdAt:Number(node.dataset.providerSubmittedAt||Date.now()),
      provider:providerTasks.some(x=>x.taskApi==='mock')?'mock':providerTasks.some(x=>x.taskApi==='rivo')?'rivo':providerTasks.some(x=>x.taskApi==='otterl')?'otterl':'kie',
      providerTasks,
      model:node.dataset.providerModel||node.dataset.modelName||'GPT Image 2',
      sizeState:node.dataset.providerSizeState||node.dataset.sizeState||'',
      promptText:node.dataset.providerPrompt||node.dataset.promptText||'',promptHtml:node.dataset.promptHtml||''
    };
    setNodeStatus(node,'running','恢复结果');
    try{
      const runtime=window.KAI_IMAGE_RUNTIME;
      if(!runtime?.pollProviderTasks||!runtime?.applyRealResults)throw new Error('图片恢复模块尚未初始化');
      const result=await runtime.pollProviderTasks(providerTasks,task,node,controller);
      if(!result.successes.length){
        const terminalError=new Error(result.failures.map(x=>x.failMsg||x.failCode).filter(Boolean).join('；')||'任务没有可恢复结果');
        terminalError.providerTerminalFailure=Boolean(result.failures.length);throw terminalError;
      }
      try{runtime.applyRealResults(node,result.urls,task.promptText,task)}
      catch(applyError){console.warn('标准恢复流程失败，改用图片直填',applyError);forceRecoveredImage(node,result.urls[0],task.promptText)}
      let delivery={confirmedCount:0,warnings:[]};
      if(runtime.confirmTemporaryDeliveries){try{delivery=await runtime.confirmTemporaryDeliveries(providerTasks,result.successes)}catch(error){delivery.warnings.push('图片已恢复；交付状态确认暂时异常：'+(error?.message||'未知错误'))}}
      node.dataset.providerTasks=JSON.stringify(providerTasks);
      node.dataset.providerRecoveryState='done';
      delete node.__kaiRecoveryFailedAt;
      const restoredImage=node.querySelector('.uploaded-image');
      watchRecoveredImage(node,restoredImage);
      // Reconcile the original queue row. Previously the 8-minute local timeout
      // remained red even after recovery had proved that the same provider task
      // succeeded, which made a successful image look like a failed generation.
      const recoveredIds=new Set(providerTasks.map(item=>item.taskId).filter(Boolean));
      workflowQueue.filter(item=>item.nodeId===node.id&&Array.isArray(item.providerTaskIds)&&item.providerTaskIds.some(id=>recoveredIds.has(id))).forEach(item=>{
        item.status='done';item.phase=delivery.warnings?.length?'warning':'success';item.note='生成成功（已自动找回）';item.errorReason='';item.finishedAt=item.finishedAt||Date.now();
      });
      runtime.clearGenerationFailure?.(node);
      setNodeStatus(node,'done',delivery.warnings?.length?'已恢复·规格提示':'已恢复');
      renderTaskQueue();
      await saveProject();
      if(!quiet)note(legacy?'已找回刷新前生成的图片':'已自动恢复生成结果');
      return true;
    }catch(error){
      if(error?.name!=='AbortError'){
        node.dataset.providerRecoveryState=error?.providerTerminalFailure?'failed':'error';
        node.__kaiRecoveryFailedAt=Date.now();
        window.KAI_IMAGE_RUNTIME?.showGenerationFailure?.(node,task,error?.message||'结果恢复失败','generating');
        setNodeStatus(node,'error',error?.providerTerminalFailure?'失败·查看原因':'恢复失败');
        if(!quiet)note('结果恢复失败：'+(error?.message||'未知错误'));
        console.warn('图片结果恢复失败',error);
      }
      return false;
    }finally{recoveringNodes.delete(node)}
  }

  function applyRecoveredAgentResult(node,item){
    const text=String(item?.text||'').trim();
    if(!node?.isConnected||!text)return false;
    removeAgentInlineOutput(node);
    node.dataset.outputText=text;
    node.dataset.agentRequestId=item.requestId||node.dataset.agentRequestId||'';
    node.dataset.agentTaskId=item.taskId||node.dataset.agentTaskId||'';
    node.dataset.agentModel=item.model||node.dataset.agentModel||'';
    node.dataset.agentUpdatedAt=String(item.settledAt||Date.now());
    node.dataset.agentRecoveryState='done';
    const modelSelect=node.querySelector('.agent-model');
    if(modelSelect&&[...modelSelect.options].some(option=>option.value===item.model))modelSelect.value=item.model;
    if(window.KAI_AGENT_TEXT_RUNTIME?.deliver)window.KAI_AGENT_TEXT_RUNTIME.deliver(node,text,{create:true});
    else [...document.querySelectorAll('.wire path[data-a][data-b]')]
      .filter(path=>path.dataset.a===node.id)
      .map(path=>document.getElementById(path.dataset.b)).filter(Boolean)
      .forEach(target=>{const field=target.matches('.text-node,.note-node')?target.querySelector('textarea'):null;if(field){field.value=text;field.dispatchEvent(new Event('input',{bubbles:true}));target.dataset.outputText=text}});
    workflowQueue.filter(task=>task.nodeId===node.id&&task.type==='agent'&&task.billingRequestId===item.requestId).forEach(task=>{
      task.status='done';task.phase='success';task.note='对话完成（已自动找回）';task.errorReason='';task.finishedAt=task.finishedAt||Date.now();
    });
    setNodeStatus(node,'done','已找回');
    renderTaskQueue();
    return true;
  }

  function showAgentRecoveryError(node,message){
    if(!node?.isConnected)return;
    const box=ensureAgentResult(node);box.hidden=false;box.classList.add('error');box.textContent='Agent 运行失败：'+message;
    node.dataset.agentLastError=message;
    node.dataset.agentRecoveryState='error';
    setNodeStatus(node,'error','失败');
    scheduleSave();
  }

  async function recoverAgentNodeStatus(node,{wait=false}={}){
    const requestId=node?.dataset?.agentRequestId||'';
    if(!requestId||String(node.dataset.outputText||'').trim()||recoveringAgentNodes.has(node))return false;
    recoveringAgentNodes.add(node);
    const deadline=Date.now()+(wait?13*60*1000:1);
    let lastError='';
    try{
      do{
        try{
          const data=await apiFetch('/api/agent/status?requestId='+encodeURIComponent(requestId),{timeoutMs:10000});
          window.KAI_WALLET?.apply(data.wallet);
          const item=data.task||{};
          if(item.state==='charged'&&item.text)return applyRecoveredAgentResult(node,item);
          if(item.state==='released'){showAgentRecoveryError(node,item.error||'调用没有成功，冻结积分已返还');return false}
          setNodeStatus(node,'running','等待结果');
          lastError='';
        }catch(error){lastError=error?.message||'没有找到后台任务记录'}
        if(!wait||Date.now()>=deadline)break;
        await new Promise(resolve=>setTimeout(resolve,3000));
      }while(Date.now()<deadline);
      if(lastError)showAgentRecoveryError(node,lastError+'；本次没有正式扣分');
      return false;
    }finally{recoveringAgentNodes.delete(node)}
  }

  async function recoverAgentResults({manual=false}={}){
    try{
      const data=await apiFetch('/api/agent/results/recent?limit=30',{timeoutMs:10000});
      window.KAI_WALLET?.apply(data.wallet);
      const results=Array.isArray(data.results)?data.results:[];
      const nodes=[...document.querySelectorAll('.agent-node')];
      const claimed=new Set();
      nodes.forEach(node=>{
        if(node.dataset.agentRequestId)claimed.add('request:'+node.dataset.agentRequestId);
        if(node.dataset.agentTaskId)claimed.add('task:'+node.dataset.agentTaskId);
      });
      let recovered=0;
      for(const node of nodes){
        if(String(node.dataset.outputText||'').trim())continue;
        const item=results.find(result=>(node.dataset.agentRequestId&&result.requestId===node.dataset.agentRequestId)||(node.dataset.agentTaskId&&result.taskId===node.dataset.agentTaskId));
        if(item&&applyRecoveredAgentResult(node,item))recovered+=1;
      }
      const pending=nodes.filter(node=>!String(node.dataset.outputText||'').trim()&&node.dataset.agentRequestId);
      const statusResults=await Promise.all(pending.map(node=>recoverAgentNodeStatus(node,{wait:!manual})));
      recovered+=statusResults.filter(Boolean).length;
      // 手动找回只处理当前画布已有节点及其 requestId/taskId。
      // 不再把账号历史记录自动创建成新节点，避免旧内容重复出现在画布中。
      if(recovered){scheduleSave();try{await saveProject()}catch{}}
      return recovered;
    }catch(error){if(!/请先登录/.test(error?.message||''))console.warn('读取 Agent 历史结果失败',error);return 0}
  }

  async function recoverKieTasks({manual=false,quiet=false,force=false}={}){
    const allGenerationNodes=[...document.querySelectorAll('.generation-node')];
    const emptyNodes=allGenerationNodes.filter(node=>['missing','broken'].includes(nodeImageState(node))&&!node.__kaiLivePolling&&(force||!['failed','error'].includes(node.dataset.providerRecoveryState||'')));
    const claimed=new Set();
    allGenerationNodes.forEach(node=>savedProviderTasks(node).forEach(x=>claimed.add(x.taskId)));
    const recoveries=[];
    for(const node of emptyNodes){
      let tasks=savedProviderTasks(node);
      const requestId=node.dataset.providerRequestId||'';
      if(!tasks.length&&requestId){
        try{
          const data=await apiFetch('/api/tasks/by-request/'+encodeURIComponent(requestId),{timeoutMs:10000});
          tasks=(Array.isArray(data.tasks)?data.tasks:[]).filter(item=>item?.taskId).map(item=>({
            taskId:item.taskId,taskApi:item.taskApi||'market',providerModel:item.providerModel||item.model||''
          }));
          if(tasks.length){
            node.dataset.providerTasks=JSON.stringify(tasks);
            node.dataset.providerSubmittedAt=String(data.tasks?.[0]?.createdAt||node.dataset.providerSubmittedAt||Date.now());
            node.dataset.providerRecoveryState='pending';
            tasks.forEach(item=>claimed.add(item.taskId));
          }
        }catch(error){
          if(manual)console.warn('按请求 ID 查询图片任务失败',error);
        }
      }
      if(tasks.length)recoveries.push(recoverNode(node,tasks,{quiet:manual,force}));
    }

    if(manual){
      if(!recoveries.length){if(!quiet)note('没有发现需要找回的图片任务');return 0}
      scheduleSave();
      const results=await Promise.all(recoveries);
      const recovered=results.filter(Boolean).length;
      if(!quiet){if(recovered)note(`已找回 ${recovered} 个生成结果`);else note('暂时没有可加载的图片结果，请稍后再试')}
      window.KAI_WALLET?.refresh();
      return recovered;
    }

    // 兼容升级前已经提交、但刷新时尚未把 taskId 写进节点的那一次任务。
    const legacyCandidates=emptyNodes.filter(node=>!savedProviderTasks(node).length&&['running','pending'].includes(node.dataset.runState||''));
    if(legacyCandidates.length!==1)return Promise.all(recoveries);
    try{
      const data=await apiFetch('/api/tasks/recent?limit=12',{timeoutMs:10000});
      const recent=(data.tasks||[]).find(item=>item?.taskId&&!claimed.has(item.taskId)&&item.state!=='released'&&['market','gpt4o','otterl','rivo','mock'].includes(item.taskApi||'market'));
      if(!recent)return Promise.all(recoveries);
      const node=legacyCandidates[0];
      const tasks=[{taskId:recent.taskId,taskApi:recent.taskApi||'market',providerModel:recent.model||''}];
      node.dataset.providerTasks=JSON.stringify(tasks);
      node.dataset.providerModel=recent.model||node.dataset.modelName||'GPT Image 2';
      node.dataset.providerSubmittedAt=String(recent.createdAt||Date.now());
      scheduleSave();
      recoveries.push(recoverNode(node,tasks,{legacy:true}));
    }catch(error){console.warn('读取最近 Kie 任务失败',error)}
    return Promise.all(recoveries);
  }

  document.getElementById('recoverTaskResults')?.addEventListener('click',async event=>{
    event.stopPropagation();
    if(manualRecoveryBusy){note('正在查询后台任务，请稍候');return}
    manualRecoveryBusy=true;
    const button=event.currentTarget;
    const previous=button.textContent;
    button.disabled=true;button.textContent='查询中…';
    note('正在从后台找回图片和 Agent 对话…');
    try{
      const [images,agents]=await Promise.all([recoverKieTasks({manual:true,quiet:true,force:true}),recoverAgentResults({manual:true})]);
      const total=Number(images||0)+Number(agents||0);
      if(total)note(`已找回 ${images||0} 个图片结果、${agents||0} 个 Agent 对话`);
      else note('没有发现可找回的图片或 Agent 对话');
    }
    finally{manualRecoveryBusy=false;button.disabled=false;button.textContent=previous}
  });

  const restoreProjectBeforeKieRecovery=restoreProject;
  restoreProject=function(data){
    const result=restoreProjectBeforeKieRecovery(data);
    setTimeout(recoverKieTasks,180);
    setTimeout(recoverAgentResults,260);
    return result;
  };
  setTimeout(recoverKieTasks,900);
  setTimeout(recoverAgentResults,1100);
  let taskEventSource=null;
  let taskStreamSignature='';
  let backgroundSyncBusy=false;
  let backgroundSyncQueued=false;

  function currentTaskBindings(){
    const images=[];
    document.querySelectorAll('.generation-node').forEach(node=>{
      if(['ready','loading'].includes(nodeImageState(node)))return;
      savedProviderTasks(node).forEach(item=>images.push({taskId:item.taskId,taskApi:item.taskApi||'market'}));
    });
    const agents=[...document.querySelectorAll('.agent-node')]
      .filter(node=>!String(node.dataset.outputText||'').trim()&&node.dataset.agentRequestId)
      .map(node=>node.dataset.agentRequestId);
    const imageMap=new Map(images.map(item=>[item.taskId,item]));
    return{images:[...imageMap.values()],agents:[...new Set(agents)]};
  }

  async function syncCurrentCanvas(){
    if(backgroundSyncBusy){backgroundSyncQueued=true;return}
    backgroundSyncBusy=true;
    try{
      await Promise.all([recoverKieTasks({manual:true,quiet:true}),recoverAgentResults({manual:true})]);
    }catch(error){
      if(navigator.onLine)console.warn('当前画布任务自动同步失败',error);
    }finally{
      backgroundSyncBusy=false;
      refreshTaskStream();
      if(backgroundSyncQueued){backgroundSyncQueued=false;setTimeout(syncCurrentCanvas,80)}
    }
  }

  function refreshTaskStream(){
    const bindings=currentTaskBindings();
    const signature=JSON.stringify(bindings);
    if(signature===taskStreamSignature&&taskEventSource)return;
    taskEventSource?.close();taskEventSource=null;taskStreamSignature=signature;
    if(!bindings.images.length&&!bindings.agents.length)return;
    const params=new URLSearchParams({images:JSON.stringify(bindings.images),agents:JSON.stringify(bindings.agents)});
    const source=new EventSource('/api/tasks/stream?'+params.toString());
    taskEventSource=source;
    source.onmessage=event=>{
      let update={};try{update=JSON.parse(event.data||'{}')}catch{return}
      if(update.kind==='image'){
        document.querySelectorAll('.generation-node').forEach(node=>{
          if(savedProviderTasks(node).some(item=>item.taskId===update.taskId)&&['missing','broken'].includes(nodeImageState(node))){
            if(update.state==='generating')setNodeStatus(node,'running','生成中');
            else if(['waiting','queuing'].includes(update.state))setNodeStatus(node,'running','排队中');
          }
        });
      }
      if(['success','fail','charged','released'].includes(update.state))syncCurrentCanvas();
    };
    source.onerror=()=>{ /* EventSource 会自动重连，3 秒补查同时兜底。 */ };
  }

  const fallbackSyncTimer=setInterval(()=>{
    refreshTaskStream();
    if(!document.hidden&&navigator.onLine)syncCurrentCanvas();
  },3000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshTaskStream();syncCurrentCanvas()}});
  window.addEventListener('online',()=>{refreshTaskStream();syncCurrentCanvas()});
  window.addEventListener('beforeunload',()=>{taskEventSource?.close();clearInterval(fallbackSyncTimer)});
  setTimeout(()=>{refreshTaskStream();syncCurrentCanvas()},1300);
  window.KAI_TASK_RECOVERY={recoverAll:()=>Promise.all([recoverKieTasks({manual:true,quiet:true}),recoverAgentResults({manual:true})]),syncNow:syncCurrentCanvas};
})();

</script>

<script>
/* REAL_AGENT_BACKEND_V1 */
(function(){
  const AGENT_MODELS=['GPT 5.5','GPT 5.6 Luna','Gemini 3.5 Flash','Gemini 3.1 Pro Preview'];
  const controllers=new Map();
  const activeAgentTasks=new Set();
  const sharedConcurrency=window.KAI_TASK_CONCURRENCY||(window.KAI_TASK_CONCURRENCY={active:new Set(),max:10});
  sharedConcurrency.max=10;
  const cancelBeforeAgentRuntime=cancelWorkflowTask;

  cancelWorkflowTask=function(taskId,quiet=false){
    const task=workflowQueue.find(item=>item.id===taskId);
    if(!task||task.type!=='agent')return cancelBeforeAgentRuntime(taskId,quiet);
    if(!['pending','running'].includes(task.status))return false;
    const node=document.getElementById(task.nodeId);
    const submitted=Boolean(task.submissionStartedAt||task.billingRequestId);
    const providerAccepted=Boolean(node?.dataset?.agentTaskId);
    if(task.status==='running'&&submitted&&!providerAccepted){
      task.cancelPending=true;
      task.note='正在确认 Agent 任务编号，随后停止等待';
      renderTaskQueue();scheduleSave();
      if(!quiet)note('正在确认 Agent 是否已提交，拿到任务编号后会停止等待');
      return true;
    }
    if(!submitted){controllers.get(taskId)?.abort();return cancelBeforeAgentRuntime(taskId,quiet)}
    controllers.get(taskId)?.abort();
    task.status='detached';task.phase='background';task.note='已停止等待；Agent 在后台继续并计费，可稍后点击“找回结果”';
    task.finishedAt=Date.now();task.durationMs=task.startedAt?task.finishedAt-task.startedAt:0;
    if(node){node.dataset.agentRecoveryState='pending';setNodeStatus(node,'pending','后台处理中')}
    renderTaskQueue();scheduleSave();
    if(!quiet)note('已停止等待；Agent 仍会在后台继续并计费，可稍后找回结果');
    return true;
  };

  function syncAgentModels(node){
    const select=node?.querySelector('.agent-model');if(!select)return;
    const prior=select.value;
    select.replaceChildren(...AGENT_MODELS.map(name=>new Option(name,name)));
    select.value=AGENT_MODELS.includes(prior)?prior:'GPT 5.6 Luna';
  }
  document.querySelectorAll('.agent-node').forEach(syncAgentModels);
  setTimeout(()=>document.querySelectorAll('.agent-node').forEach(syncAgentModels),500);

  async function agentFetch(path,options={}){
    const controller=options.controller||new AbortController();
    const timer=setTimeout(()=>controller.abort(),options.timeoutMs||210000);
    const saved=(localStorage.getItem('xiaokai-backend-url')||'').trim().replace(/\/$/,'');
    const base=saved||(location.protocol==='http:'||location.protocol==='https:'?(location.hostname==='127.0.0.1'||location.hostname==='localhost'?(location.port==='4318'?'':'http://127.0.0.1:4318'):''):'http://127.0.0.1:4318');
    try{
      const response=await fetch(base+path,{method:options.method||'GET',headers:{'Content-Type':'application/json',...(options.headers||{})},body:options.body==null?undefined:JSON.stringify(options.body),signal:controller.signal});
      const raw=await response.text();let data={};try{data=raw?JSON.parse(raw):{}}catch{data={error:raw||('HTTP '+response.status)}}
      if(!response.ok||data?.ok===false)throw new Error(data?.error||data?.message||('HTTP '+response.status));
      return data;
    }finally{clearTimeout(timer)}
  }

  async function selectedSkill(node){
    const name=node.querySelector('.agent-skill')?.value||'无 Skill';
    if(!name||name==='无 Skill'||name==='加载 Skill 文件…')return{name:'',content:''};
    const item=(await readSkills()).find(x=>x.name===name);
    if(!item)throw new Error('所选 Skill 已不存在，请重新加载');
    return{name:item.name,content:item.content||''};
  }

  function deliverAgentText(agentNode,text,{create=true}={}){
    const value=String(text||'').trim();if(!agentNode?.isConnected||!value)return[];
    let targets=[...document.querySelectorAll('.wire path[data-a][data-b]')]
      .filter(path=>path.dataset.a===agentNode.id)
      .map(path=>document.getElementById(path.dataset.b))
      .filter(target=>target?.matches('.text-node,.note-node'));
    if(!targets.length&&create){
      let target=[...document.querySelectorAll('.text-node,.note-node')].find(node=>node.dataset.agentOutputFor===agentNode.id);
      if(!target){
        const previous=selectedNode;
        target=createTextNode('text',agentNode.offsetLeft+agentNode.offsetWidth+170,agentNode.offsetTop+70,'',true);
        target.dataset.agentOutputFor=agentNode.id;
        const label=target.querySelector('.node-label');if(label)label.textContent='T　Agent 完整文案';
        const card=target.querySelector('.text-card');if(card){card.style.width='460px';card.style.height='420px'}
        createStableWire(agentNode,target);
        if(previous?.isConnected)selectNode(previous,false,true);
      }else if(![...document.querySelectorAll('.wire path[data-a][data-b]')].some(path=>path.dataset.a===agentNode.id&&path.dataset.b===target.id)){
        createStableWire(agentNode,target);
      }
      targets=[target];
    }
    targets.forEach(target=>{
      target.dataset.agentOutputFor=agentNode.id;target.dataset.outputText=value;
      const textarea=target.querySelector('textarea');
      if(textarea){textarea.value=value;textarea.dispatchEvent(new Event('input',{bubbles:true}));textarea.scrollTop=0}
    });
    if(targets.length){wires();scheduleSave()}
    return targets;
  }

  function pushAgentTextToConnectedNodes(agentNode,text){
    const targets=deliverAgentText(agentNode,text,{create:true});
    pushAgentOutputDownstream(agentNode,text);
    if(targets.length)note('Agent 完整文案已写入下游文本节点');
  }

  window.KAI_AGENT_TEXT_RUNTIME={deliver:deliverAgentText};
  const agentWireObserver=new MutationObserver(changes=>{
    changes.flatMap(change=>[...change.addedNodes]).filter(node=>node?.matches?.('path[data-a][data-b]')).forEach(path=>{
      const source=document.getElementById(path.dataset.a),target=document.getElementById(path.dataset.b);
      const text=String(source?.dataset?.outputText||'').trim();
      if(source?.classList.contains('agent-node')&&target?.matches('.text-node,.note-node')&&text)deliverAgentText(source,text,{create:false});
    });
  });
  agentWireObserver.observe(document.querySelector('.wire'),{childList:true});

  async function compactAgentImage(source){
    const value=String(source||'');
    if(!value||(/^data:image\//i.test(value)&&value.length<2200000))return value;
    try{
      const image=new Image();image.crossOrigin='anonymous';image.src=value;await image.decode();
      const maxSide=1600,scale=Math.min(1,maxSide/Math.max(image.naturalWidth,image.naturalHeight));
      const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
      const context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height);
      return canvas.toDataURL('image/jpeg',.84);
    }catch(error){console.warn('Agent 参考图压缩失败，使用原图',error);return value}
  }

  async function runAgent(task,node){
    const controller=new AbortController();controllers.set(task.id,controller);
    const started=Date.now();task.startedAt=started;task.status='running';task.phase='uploading';task.note='连接 Agent 模型';
    setNodeStatus(node,'running','连接模型');renderTaskQueue();
    try{
      const payload=collectInputPayload(node);
      const fields=[...node.querySelectorAll('.agent-fields textarea')];
      const skill=await selectedSkill(node);
      task.note='正在优化参考图';renderTaskQueue();
      const compactedImages=await Promise.all(payload.images.slice(0,6).map(item=>compactAgentImage(item.value)));
      task.phase='generating';task.note='模型思考中';setNodeStatus(node,'running','思考中');renderTaskQueue();
      task.billingRequestId=task.billingRequestId||(globalThis.crypto?.randomUUID?.()||('agent-'+Date.now()+'-'+Math.random().toString(16).slice(2)));
      task.submissionStartedAt=Date.now();
      node.dataset.agentRequestId=task.billingRequestId;
      node.dataset.agentSubmittedAt=String(Date.now());
      node.dataset.agentRecoveryState='pending';
      scheduleSave();
      try{await saveProject()}catch{}
      const result=await agentFetch('/api/agent/run',{
        method:'POST',controller,timeoutMs:210000,
        headers:{'Idempotency-Key':task.billingRequestId},
        body:{
          model:node.querySelector('.agent-model')?.value||'GPT 5.6 Luna',
          metaPrompt:fields[0]?.value.trim()||'',userNeed:fields[1]?.value.trim()||'',
          skillName:skill.name,skillContent:skill.content,
          contextTexts:payload.texts.map(x=>({label:x.label,value:x.value})),
          images:compactedImages.filter(Boolean)
        }
      });
      node.dataset.agentTaskId=result.taskId||node.dataset.agentTaskId||'';
      node.dataset.agentRequestId=result.requestId||task.billingRequestId;
      window.KAI_WALLET?.apply(result.wallet);
      if(task.cancelPending&&result.accepted){
        task.status='detached';task.phase='background';task.note='已停止等待；Agent 在后台继续并计费，可稍后点击“找回结果”';
        task.finishedAt=Date.now();task.durationMs=task.finishedAt-started;
        node.dataset.agentRecoveryState='pending';setNodeStatus(node,'pending','后台处理中');renderTaskQueue();scheduleSave();
        note('已停止等待；Agent 任务会在后台继续，可稍后找回结果');
        return;
      }
      let finalResult=result;
      let text=String(result.text||'').trim();
      if(!text&&result.accepted){
        task.phase='generating';task.note='后台处理中，可安全刷新页面';setNodeStatus(node,'running','后台处理中');renderTaskQueue();
        const deadline=Date.now()+13*60*1000;
        let lastPollError='';
        while(Date.now()<deadline){
          if(controller.signal.aborted)throw new DOMException('已取消','AbortError');
          await new Promise(resolve=>setTimeout(resolve,3000));
          try{
            const status=await agentFetch('/api/agent/status?requestId='+encodeURIComponent(node.dataset.agentRequestId),{timeoutMs:15000});
            window.KAI_WALLET?.apply(status.wallet);
            const item=status.task||{};
            if(item.state==='charged'&&String(item.text||'').trim()){
              finalResult={...result,...item,text:item.text,quote:item.quote||result.quote,wallet:status.wallet};
              text=String(item.text).trim();break;
            }
            if(item.state==='released')throw new Error(item.error||'Agent 调用失败，冻结积分已返还');
            lastPollError='';
            task.note='后台处理中，可安全刷新页面';setNodeStatus(node,'running','后台处理中');renderTaskQueue();
          }catch(error){
            if(error?.name==='AbortError')throw error;
            if(/冻结积分已返还|调用失败|上游处理超时/i.test(error?.message||''))throw error;
            lastPollError=error?.message||'暂时无法读取任务状态';
          }
        }
        if(!text){
          const error=new Error((lastPollError?lastPollError+'；':'')+'后台仍在处理，请稍后点击“找回结果”');
          error.agentPending=true;throw error;
        }
      }
      if(!text)throw new Error('Agent 没有返回文字');
      removeAgentInlineOutput(node);node.dataset.outputText=text;
      node.dataset.agentRecoveryState='done';
      node.dataset.agentModel=finalResult.model||task.model;node.dataset.agentUpdatedAt=String(Date.now());
      pushAgentTextToConnectedNodes(node,text);
      window.KAI_WALLET?.apply(finalResult.wallet);
      const charged=Number(finalResult.quote?.total||0);const chargedText=charged?(' · 扣除 '+charged+' 积分（¥'+Number(finalResult.quote?.totalRmb||charged*.01).toFixed(2)+'）'):'';
      task.status='done';task.phase='success';task.note='对话完成'+chargedText;task.finishedAt=Date.now();task.durationMs=task.finishedAt-started;
      setNodeStatus(node,'done','已完成');note('Agent 已返回真实模型结果'+chargedText);
    }catch(error){
      if(error?.name==='AbortError'||['canceled','detached'].includes(task.status))return;
      if(error?.agentPending){
        task.status='done';task.phase='pending';task.note=error.message;task.finishedAt=Date.now();task.durationMs=task.finishedAt-started;
        const box=ensureAgentResult(node);box.hidden=false;box.classList.remove('error');box.textContent='Agent 已在后台继续处理。\n可以刷新或关闭页面，稍后点击右下角“找回结果”。';
        node.dataset.agentRecoveryState='pending';setNodeStatus(node,'running','后台处理中');note(error.message);return;
      }
      task.status='error';task.phase='failed';task.errorReason=error?.message||'Agent 调用失败';task.note=task.errorReason;task.finishedAt=Date.now();task.durationMs=task.finishedAt-started;
      const box=ensureAgentResult(node);box.hidden=false;box.classList.add('error');box.textContent='Agent 运行失败：'+task.errorReason+'\n失败不会扣除积分，已冻结的积分会自动返还。';
      node.dataset.agentLastError=task.errorReason;node.dataset.agentRecoveryState='error';
      setNodeStatus(node,'error','失败');note('Agent：'+task.errorReason);
    }finally{controllers.delete(task.id);window.KAI_WALLET?.refresh()}
  }

  const previousQueueNodeExecution=queueNodeExecution;
  queueNodeExecution=function(node,options={}){
    if(node?.classList.contains('agent-node')){
      syncAgentModels(node);
      const model=node.querySelector('.agent-model')?.value||'GPT 5.6 Luna';
      const result=previousQueueNodeExecution(node,{...(options||{}),lockedModel:model});
      const task=[...workflowQueue].reverse().find(item=>item.nodeId===node.id&&item.status==='pending');
      if(task){task.model=model;task.sizeLabel=node.querySelector('.agent-skill')?.value||'无 Skill';renderTaskQueue()}
      return result;
    }
    return previousQueueNodeExecution(node,options);
  };

  const previousProcessWorkflowQueue=processWorkflowQueue;
  processWorkflowQueue=async function(){
    const pendingFirst=workflowQueue.find(task=>task.status==='pending');
    if(!pendingFirst)return;
    if(sharedConcurrency.active.size>=sharedConcurrency.max)return;
    if(pendingFirst.type!=='agent')return previousProcessWorkflowQueue();
    const hasOrderedRun=workflowQueue.some(task=>task.status==='running'&&task.workflowRunId);
    const next=pendingFirst;
    if(workflowQueue.some(active=>active.status==='running'&&active.nodeId===next.nodeId))return;
    if(next.workflowRunId&&(hasOrderedRun||workflowQueue.find(item=>item.status==='pending'&&item.workflowRunId===next.workflowRunId)!==next))return;
    const node=document.getElementById(next.nodeId);
    if(!node){next.status='error';next.phase='failed';next.note='Agent 节点不存在';renderTaskQueue();return}
    activeAgentTasks.add(next.id);sharedConcurrency.active.add(next.id);
    setTimeout(processWorkflowQueue,0);
    runAgent(next,node).finally(()=>{
      activeAgentTasks.delete(next.id);sharedConcurrency.active.delete(next.id);renderTaskQueue();scheduleSave();setTimeout(processWorkflowQueue,80)
    });
  };

  const previousCancelWorkflowTask=cancelWorkflowTask;
  cancelWorkflowTask=function(taskId,quiet=false){controllers.get(taskId)?.abort();return previousCancelWorkflowTask(taskId,quiet)};
})();
</script>
<script>
/* SKILL_NODE_BINDING_V1 */
(function(){
  const skillButton=document.getElementById('promptLibrary');
  let skillTargetNode=null;

  function cleanSkillName(name=''){return String(name).trim()}
  function isUsableSkill(name){return name&&name!=='无 Skill'&&name!=='加载 Skill 文件…'}
  function shortName(name){return name.length>18?name.slice(0,16)+'…':name}
  function canUseSkill(node){return !!(node?.isConnected&&(node.classList.contains('generation-node')||node.classList.contains('agent-node')))}
  async function syncSkillConsumers(list){
    const seen=new Set();
    const skills=(list||await readSkills()).filter(item=>item?.name&&item.content&&!seen.has(item.name)&&seen.add(item.name));
    const names=new Set(skills.map(item=>item.name));
    document.querySelectorAll('.agent-node').forEach(node=>{
      const select=node.querySelector('.agent-skill');if(!select)return;
      const current=cleanSkillName(node.dataset.skillName||select.value||'');
      [...select.options].filter(option=>isUsableSkill(option.value)).forEach(option=>option.remove());
      skills.forEach(item=>select.add(new Option(item.name,item.name)));
      if(names.has(current))select.value=current;
      else if(current==='加载 Skill 文件…')select.value=current;
      else{select.value='无 Skill';delete node.dataset.skillName;delete node.dataset.skillContent}
      updateAgentSkillState(node);
    });
    const active=skills.find(item=>item.name===document.getElementById('skillName')?.textContent);
    if(!active&&document.getElementById('skillName'))document.getElementById('skillName').textContent='未加载 Skill';
    return skills;
  }
  function resolveSkillTarget(){
    if(canUseSkill(selectedNode))return selectedNode;
    if(canUseSkill(skillTargetNode))return skillTargetNode;
    const selectedCard=document.querySelector('.node .card.selected,.node .card.multi-selected');
    const cardNode=selectedCard?.closest('.node');
    if(canUseSkill(cardNode))return cardNode;
    const selectedSet=[...selectedNodes].find(canUseSkill);
    return selectedSet||null;
  }

  function updateDockSkill(node=selectedNode){
    if(!skillButton)return;
    const name=cleanSkillName(node?.dataset?.skillName||'');
    skillButton.textContent=name?('✓ '+shortName(name)):'Skill库';
    skillButton.title=name?('已应用 Skill：'+name):'打开 Skill 库';
    const ready=!!promptBox.value.trim()||!!name;
    run.classList.toggle('ready',ready);
  }

  function updateAgentSkillState(node){
    if(!node?.classList.contains('agent-node'))return;
    const select=node.querySelector('.agent-skill');
    const name=cleanSkillName(select?.value||'');
    const fields=[...node.querySelectorAll('.agent-fields textarea')];
    const button=node.querySelector('.agent-run');
    let badge=node.querySelector('.agent-skill-applied');
    if(!badge){
      badge=document.createElement('span');badge.className='agent-skill-applied';
      const output=node.querySelector('.agent-output');output?.appendChild(badge);
    }
    const applied=isUsableSkill(name);
    badge.textContent=applied?'✓ Skill 已应用':'';
    badge.title=applied?('运行时会读取完整内容：'+name):'';
    button?.classList.toggle('ready',applied||fields.some(x=>x.value.trim()));
    if(select)select.title=applied?('已应用完整 Skill 内容：'+name):'选择 Skill';
  }

  function bindAgentSkillState(node){
    if(!node?.classList.contains('agent-node'))return;
    removeAgentInlineOutput(node,{includeError:false});
    const select=node.querySelector('.agent-skill');
    if(select&&!select.dataset.skillStateBound){
      select.dataset.skillStateBound='1';
      select.addEventListener('change',async()=>{const name=cleanSkillName(select.value);const item=(await readSkills()).find(skill=>skill.name===name);if(item){node.dataset.skillName=item.name;node.dataset.skillContent=item.content||'';document.getElementById('skillName').textContent=item.name}else if(name==='无 Skill'){delete node.dataset.skillName;delete node.dataset.skillContent}updateAgentSkillState(node);scheduleSave()});
    }
    readSkills().then(syncSkillConsumers);
    updateAgentSkillState(node);
    setTimeout(()=>updateAgentSkillState(node),250);
  }

  async function applySkill(item){
    if(!item?.name)return;
    document.getElementById('skillName').textContent=item.name;
    const target=resolveSkillTarget();
    if(target?.classList.contains('agent-node')){
      const select=target.querySelector('.agent-skill');
      if(select&&! [...select.options].some(option=>option.value===item.name))select.add(new Option(item.name,item.name));
      if(select)select.value=item.name;

/* AI_CUTOUT_AND_ERASE_V1 */
(function(){
  const TOOL_MODEL='GPT Image 2';
  const CUTOUT_PROMPT='Remove the entire background from the provided image. Preserve the subject exactly, including face, hair, clothing, product shape, fine edges, shadows that belong to the subject, colors and proportions. Return a clean PNG with true alpha transparency outside the subject. Do not add a new background, text, border, watermark or extra object.';
  const ERASE_PROMPT='Edit the provided original image using the supplied transparency mask. Remove only the object or content inside the transparent painted region, then reconstruct the missing background naturally with matching texture, lighting, perspective and surrounding details. Keep every unmasked part of the original image unchanged. Do not add new objects, text, borders or watermarks.';

  function toolSizeState(source,transparent){
    const state=captureSizeState();
    state.background=transparent?1:0;
    state.count=0;
    const oneK=[...document.querySelectorAll('.resolution-grid button')].findIndex(button=>button.dataset.value==='1K');
    if(oneK>=0)state.resolution=oneK;
    const image=source?.querySelector('.uploaded-image');
    const ratio=image?.naturalWidth&&image?.naturalHeight?image.naturalWidth/image.naturalHeight:1;
    const choices=[...document.querySelectorAll('.ratio-grid button')];
    let best=0,bestDistance=Infinity;
    choices.forEach((button,index)=>{
      const label=button.textContent.trim();
      const match=label.match(/^(\d+):(\d+)$/);
      if(!match)return;
      const distance=Math.abs(Number(match[1])/Number(match[2])-ratio);
      if(distance<bestDistance){bestDistance=distance;best=index}
    });
    state.ratio=best;
    state.text=(choices[best]?.textContent.trim()||'自适应')+' ▴';
    state.title=(choices[best]?.textContent.trim()||'自适应')+' · 1K · 1 张';
    return JSON.stringify(state);
  }

  function queueAiImageTool(source,operation,mask=''){
    const image=requireRealImage(source);if(!image)return null;
    const card=source.querySelector('.card');
    const x=source.offsetLeft+(card?.offsetWidth||270)+210;
    const y=source.offsetTop;
    const target=createGenerationNode(x,y);if(!target)return null;
    const isCutout=operation==='cutout';
    const prompt=isCutout?CUTOUT_PROMPT:ERASE_PROMPT;
    const sizeState=toolSizeState(source,isCutout);
    target.dataset.modelName=TOOL_MODEL;
    target.dataset.imageOperation=operation;
    target.dataset.editMask=mask||'';
    target.dataset.promptText=prompt;
    target.dataset.promptHtml=prompt;
    target.dataset.sizeState=sizeState;
    const state=JSON.parse(sizeState);
    target.dataset.aspectRatioLabel=[...document.querySelectorAll('.ratio-grid button')][state.ratio]?.textContent.trim()||'自适应';
    const label=target.querySelector('.node-label');
    if(label)label.textContent='▧　'+(isCutout?'AI 抠图结果':'AI 消除结果');
    connectNodesAutomatically(source,target);
    selectNode(target,false,true);
    loadPromptFromNode(target);
    queueNodeExecution(target,{lockedModel:TOOL_MODEL,lockedSizeState:sizeState,lockedPromptText:prompt,lockedPromptHtml:prompt});
    note(isCutout?'AI 抠图已加入任务队列，成功后扣除积分':'AI 消除已加入任务队列，成功后扣除积分');
    return target;
  }

  removeBackground=function(source){return queueAiImageTool(source,'cutout')};
  applyEditor=function(){
    if(!editorNode)return;
    if(editorMode!=='erase'){
      const source=editorNode,after=editorCanvas.toDataURL('image/png');
      closeEditor();createDerivedImageNode(source,after,'裁剪',{fit:true});note('已生成裁剪结果并自动连线');return;
    }
    if(!editorHasEraseMarks){note('请先涂抹要消除的区域');return}
    const source=editorNode,mask=editorCanvas.toDataURL('image/png');
    closeEditor();queueAiImageTool(source,'erase',mask);
  };
  document.getElementById('editorApply').onclick=applyEditor;
})();

    function syncPreview(save=true){preview.src=board.toDataURL('image/png');node.dataset.sketchUpdatedAt=String(Date.now());if(save)scheduleSave()}
    function setTool(tool){state.tool=tool;node.dataset.sketchTool=tool;node.querySelector('.sketch-pen')?.classList.toggle('on',tool==='pen');node.querySelector('.sketch-eraser')?.classList.toggle('on',tool==='eraser');board.style.cursor=tool==='eraser'?'cell':'crosshair'}

    function begin(event){if(event.button!==0)return;event.preventDefault();event.stopPropagation();selectNode(node,false,true);snapshotBefore();state.drawing=true;board.setPointerCapture?.(event.pointerId);const p=point(event);context.beginPath();context.moveTo(p.x,p.y);context.lineTo(p.x+.01,p.y+.01);context.lineCap='round';context.lineJoin='round';context.lineWidth=Number(node.querySelector('.sketch-size')?.value||10);context.strokeStyle=state.tool==='eraser'?'#ffffff':state.color;context.globalCompositeOperation='source-over';context.stroke()}

<script>
(()=>{
  const originalImportWorkflow=importWorkflow;
  importWorkflow=function(data){
    const existing=new Set(nodes);
    const result=originalImportWorkflow(data);
    const instance='workflow-'+Date.now()+'-'+Math.random().toString(16).slice(2);
    const importedNodes=nodes.filter(node=>!existing.has(node));
    importedNodes.forEach(node=>{node.dataset.workflowInstance=instance;node.dataset.workflowImportedAt=String(Date.now())});
    scheduleSave();
    document.dispatchEvent(new CustomEvent('kai:workflow-imported',{detail:{instance,nodeIds:importedNodes.map(node=>node.id)}}));
    return result;
  };

  function runnable(node){return node?.isConnected&&(node.classList.contains('agent-node')||node.classList.contains('generation-node'))}
  function latestWorkflowNodes(){
    const grouped=new Map();
    nodes.forEach(node=>{const key=node.dataset.workflowInstance;if(!key)return;const item=grouped.get(key)||{time:0,nodes:[]};item.time=Math.max(item.time,Number(node.dataset.workflowImportedAt)||0);item.nodes.push(node);grouped.set(key,item)});
    const latest=[...grouped.values()].sort((a,b)=>b.time-a.time)[0];
    if(latest?.nodes?.length)return latest.nodes;
    if(selectedNodes?.size>1)return [...selectedNodes];
    return nodes.filter(node=>node.isConnected);
  }
  function orderedWorkflowNodes(scope){
    const scopeSet=new Set(scope),indegree=new Map(scope.map(node=>[node.id,0])),outgoing=new Map(scope.map(node=>[node.id,[]]));
    document.querySelectorAll('.wire path[data-a][data-b]').forEach(path=>{const from=document.getElementById(path.dataset.a),to=document.getElementById(path.dataset.b);if(!scopeSet.has(from)||!scopeSet.has(to)||from===to)return;outgoing.get(from.id).push(to.id);indegree.set(to.id,(indegree.get(to.id)||0)+1)});
    const ready=scope.filter(node=>(indegree.get(node.id)||0)===0).sort((a,b)=>(parseFloat(a.style.left)||0)-(parseFloat(b.style.left)||0));
    const ordered=[];
    while(ready.length){const node=ready.shift();ordered.push(node);for(const id of outgoing.get(node.id)||[]){indegree.set(id,indegree.get(id)-1);if(indegree.get(id)===0)ready.push(document.getElementById(id))}}
    scope.forEach(node=>{if(!ordered.includes(node))ordered.push(node)});
    return ordered.filter(runnable);
  }
  function runWholeWorkflow(){
    if(workflowQueue.some(task=>task.status==='pending'||task.status==='running'))return note('任务队列正在运行，请等待完成或先取消任务');
    const targets=orderedWorkflowNodes(latestWorkflowNodes());
    if(!targets.length)return note('当前工作流中没有可运行的 Agent 或生图节点');
    const workflowRunId='whole-'+Date.now();
    targets.forEach(node=>queueNodeExecution(node,{workflowRunId}));
    note('已按连线顺序加入整套工作流，共 '+targets.length+' 个任务');
  }
  const actions=document.querySelector('.task-queue-actions');
  if(actions&&!document.getElementById('runWholeWorkflow')){const button=document.createElement('button');button.id='runWholeWorkflow';button.textContent='运行工作流';button.title='按节点连线顺序一次运行当前整套工作流';button.onclick=runWholeWorkflow;actions.prepend(button)}
})();
</script>
